plugins { id 'com.android.application' }

android {
    namespace 'tw.codeviva.cardreader'
    compileSdk 36
    defaultConfig {
        applicationId 'tw.codeviva.cardreader'
        minSdk 28
        targetSdk 36
        versionCode 12
        versionName '1.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { dex { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED' }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
